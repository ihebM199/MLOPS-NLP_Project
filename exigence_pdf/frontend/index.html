<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Démo interactive de détection de deepfakes : fusion adaptative spatiale + fréquentielle, Grad-CAM et latences."
    />
    <title>Deepfake Adaptive Fusion — Démo</title>
    <script>
      // Apply the stored theme before paint to avoid a flash.
      try {
        const stored = localStorage.getItem('daf-theme')
        const dark = stored ? stored === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
      } catch (_) {
        /* private mode */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
