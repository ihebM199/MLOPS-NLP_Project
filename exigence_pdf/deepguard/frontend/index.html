      // /analyze page theme (ported from the original repo frontend): apply the
      // stored `daf-theme` before paint to avoid a flash. Dark by default.
      try {
        const stored = localStorage.getItem('daf-theme')
        const dark = stored ? stored === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
      } catch (_) { /* private mode */ }
