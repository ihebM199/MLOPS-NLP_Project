name: docker-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Build images + docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ONNX helper deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<3" "onnx>=1.16,<2" "Pillow>=10,<12"

      - name: Create a dummy ONNX model (same 2-in / 3-out signature)
        run: python scripts/make_dummy_model.py --out models

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t deepfake-backend:ci .

      - name: Build frontend image
        run: docker build -t deepfake-frontend:ci ./frontend

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for /health
        run: |
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          echo "health status: $code"
          test "$code" = "200"
          curl -fsS http://localhost:8000/model/metadata | head -c 500

      - name: Predict a test image
        run: |
          curl -fsS -F "file=@models/sample.jpg;type=image/jpeg" http://localhost:8000/predict | tee /tmp/prediction.json
          grep -q '"label"' /tmp/prediction.json
          grep -q '"fusion_weights"' /tmp/prediction.json

      - name: Frontend reachable
        run: curl -fsS http://localhost:3000/ | grep -qi '<div id="root">'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
